[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sdrwatch"
version = "1.0.0"
description = "Сканер, аналізатор і декодер сигналів FPV-дронів для Raspberry Pi + SDR (HackRF, RTL-SDR...)"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "fastapi>=0.110", "uvicorn[standard]>=0.27", "pillow>=9.0"]

[project.optional-dependencies]
extras = ["qrcode>=7.0", "zeroconf>=0.120"]
test = ["pytest", "httpx"]

[project.scripts]
sdrwatch = "sdrwatch.__main__:main"

[tool.setuptools.packages.find]
include = ["sdrwatch*"]
