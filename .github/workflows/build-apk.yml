name: Збірка APK

on:
  push:
    branches: [master, "claude/**"]
    paths: ["mobile/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build apk --release --split-per-abi
      - run: flutter build apk --release

      - name: Перейменувати APK
        run: |
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/SDR-Watch-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../dist/SDR-Watch-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ../dist/SDR-Watch-armv7.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SDR-Watch-apk
          path: dist/*.apk

      - name: Реліз із APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: SDR Watch APK (збірка ${{ github.run_number }})
          prerelease: true
          files: dist/*.apk
          body: |
            Встановлення: завантажте SDR-Watch-universal.apk на телефон і відкрийте його
            (дозвольте встановлення з невідомих джерел). Для більшості сучасних телефонів
            підходить і менший SDR-Watch-arm64.apk.
