name: Прошивка Raspberry Pi

on:
  push:
    branches: [master, "claude/**"]
    paths: ["pi/**", ".github/workflows/build-pi.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy fastapi "uvicorn[standard]" pillow qrcode pytest httpx
      - run: cd pi && python -m pytest -q

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Пакет-інсталятор
        run: |
          mkdir -p dist sdrwatch-pi
          cp -r pi/sdrwatch pi/systemd pi/image pi/install.sh pi/requirements.txt pi/config.example.json sdrwatch-pi/
          cp docs/INSTALL_PI.md sdrwatch-pi/ 2>/dev/null || true
          rm -rf sdrwatch-pi/image/stage-sdrwatch
          tar czf dist/sdrwatch-pi.tar.gz sdrwatch-pi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: pi-${{ github.run_number }}
          name: Прошивка Raspberry Pi (збірка ${{ github.run_number }})
          prerelease: true
          files: dist/sdrwatch-pi.tar.gz
          body: |
            **sdrwatch-pi-image.img.xz** — готовий образ SD-карти (Raspberry Pi OS Lite 64-bit + SDR Watch).
            Запишіть його Raspberry Pi Imager або balenaEtcher, відредагуйте `sdrwatch.txt` на розділі `bootfs`
            (Wi-Fi, назва), вставте карту й увімкніть Pi. Образ з'являється тут приблизно через годину після пакета.

            **sdrwatch-pi.tar.gz** — інсталятор для вже встановленої Raspberry Pi OS 64-bit:
            `tar xzf sdrwatch-pi.tar.gz && sudo ./sdrwatch-pi/install.sh`

            Інструкція: docs/INSTALL_PI.md у репозиторії.

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Підготувати стадію pi-gen
        run: |
          mkdir -p stage-sdrwatch
          cp -r pi/image/stage-sdrwatch/. stage-sdrwatch/
          F=stage-sdrwatch/00-install/files
          mkdir -p $F
          cp -r pi/sdrwatch pi/systemd pi/image pi/install.sh pi/requirements.txt $F/
          rm -rf $F/image/stage-sdrwatch
          echo "PW=$(openssl rand -hex 16)" >> $GITHUB_ENV
      - uses: usimd/pi-gen-action@v1
        id: build
        with:
          image-name: sdrwatch-pi-image
          stage-list: stage0 stage1 stage2 ./stage-sdrwatch
          pi-gen-version: arm64
          compression: xz
          hostname: sdrwatch
          username: sdr
          # Випадковий пароль: SSH вимкнено, доступ вмикається через SSH_PASSWORD у sdrwatch.txt
          password: ${{ env.PW }}
          disable-first-boot-user-rename: 1
          enable-ssh: 0
          locale: en_US.UTF-8
          timezone: Europe/Kyiv
          keyboard-keymap: us
          keyboard-layout: English (US)
          wpa-country: UA
          increase-runner-disk-size: true
      - name: Перейменувати образ
        run: |
          mkdir -p dist
          cp "${{ steps.build.outputs.image-path }}" dist/sdrwatch-pi-image.img.xz
          sha256sum dist/sdrwatch-pi-image.img.xz > dist/sdrwatch-pi-image.img.xz.sha256
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: pi-${{ github.run_number }}
          name: Прошивка Raspberry Pi (збірка ${{ github.run_number }})
          prerelease: true
          files: |
            dist/sdrwatch-pi-image.img.xz
            dist/sdrwatch-pi-image.img.xz.sha256
